name: Metrics

# Needs a repository secret METRICS_TOKEN: a classic personal access token
# with the public_repo and read:user scopes. Until the secret exists every
# step is skipped, the run stays green, and the README keeps the metrics
# section hidden. After adding the secret, trigger the first run by hand
# from the Actions tab (Run workflow) or wait for the nightly schedule.

on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Report a missing token
        if: env.HAS_TOKEN != 'true'
        run: echo "METRICS_TOKEN is not set; skipping the render."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - name: Render metrics.svg
        if: env.HAS_TOKEN == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: refresh metrics"
          user: lintingyee-del
          filename: metrics.svg
          output_action: commit
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_notable: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: Reveal the metrics section in README after the first successful render
        if: env.HAS_TOKEN == 'true'
        run: |
          set -e
          git pull --rebase origin main
          if grep -q '<!-- metrics:off -->' README.md; then
            sed -i 's|<!-- metrics:off -->|<p align="center"><img src="metrics.svg" alt="GitHub metrics"></p>|' README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: enable the metrics section"
            git push origin HEAD:main
          else
            echo "metrics section already enabled"
          fi
